name: Daily refresh

on:
  schedule:
    # Daily at 07:23 UTC; off the top of the hour to reduce congestion.
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burn-calendar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Refresh calendar
        run: python pipeline/build_calendar.py
      - name: Commit updated calendar
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data/calendar.json pipeline/state.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "burn-calendar bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/calendar.json pipeline/state.json
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
          git push
