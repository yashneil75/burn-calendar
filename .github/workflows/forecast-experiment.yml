name: Experimental activity forecast

on:
  workflow_run:
    workflows: ["Daily refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-activity-forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
    steps:
      # The refresh commits its data before completing; check out the current
      # default branch rather than the triggering run's pre-refresh SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff'
      - name: Backtest and forecast
        run: |
          python pipeline/evaluate_forecast.py --out forecast-output/backtest.json
          python pipeline/forecast_experimental.py --backtest forecast-output/backtest.json --out forecast-output/forecast.json
      - name: Publish forecast without changing observations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          if ! git diff --quiet HEAD "origin/$TARGET_BRANCH" -- docs/data/calendar.json; then
            echo "Calendar changed while the forecast was running; refusing to publish stale results."
            exit 1
          fi
          git pull --ff-only origin "$TARGET_BRANCH"
          cp forecast-output/forecast.json docs/data/forecast.json
          if git diff --quiet -- docs/data/forecast.json && git ls-files --error-unmatch docs/data/forecast.json >/dev/null 2>&1; then
            echo "Forecast is unchanged."
            exit 0
          fi
          git config user.name "califire bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/forecast.json
          git commit -m "Experimental activity forecast $(date -u +%Y-%m-%d)"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Save experimental results
        uses: actions/upload-artifact@v4
        with:
          name: experimental-activity-forecast
          path: forecast-output/*.json
          retention-days: 14
